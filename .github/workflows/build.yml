
name: Build Gist APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find the project
        run: |
          if [ -f Gist.zip ]; then unzip -q -o Gist.zip; fi
          if [ -d Gist ]; then echo "PROJECT=Gist" >> "$GITHUB_ENV"; else echo "PROJECT=." >> "$GITHUB_ENV"; fi

      - name: Prepare signing key
        env:
          GIST_KEYSTORE_BASE64: ${{ secrets.GIST_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GIST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gist-release.keystore"
          echo "GIST_KEYSTORE_FILE=$RUNNER_TEMP/gist-release.keystore" >> "$GITHUB_ENV"
          chmod 600 "$RUNNER_TEMP/gist-release.keystore"

      - name: Add the speech library
        working-directory: ${{ env.PROJECT }}
        run: |
          VERSION=1.13.8
          curl -fL -o android.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VERSION}/sherpa-onnx-v${VERSION}-android.tar.bz2"
          mkdir -p libs && tar -xjf android.tar.bz2 -C libs
          ARM=$(find libs -type d -name arm64-v8a | head -n 1)
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$ARM"/*.so app/src/main/jniLibs/arm64-v8a/
          curl -fL -o source.zip "https://github.com/k2-fsa/sherpa-onnx/archive/refs/tags/v${VERSION}.zip"
          unzip -q source.zip -d sherpa-src
          KT=$(find sherpa-src -type d -name kotlin-api | head -n 1)
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp "$KT"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/

      - name: Build the APK
        working-directory: ${{ env.PROJECT }}
        env:
          GIST_KEYSTORE_FILE: ${{ env.GIST_KEYSTORE_FILE }}
          GIST_KEYSTORE_PASSWORD: ${{ secrets.GIST_KEYSTORE_PASSWORD }}
          GIST_KEY_ALIAS: ${{ secrets.GIST_KEY_ALIAS }}
          GIST_KEY_PASSWORD: ${{ secrets.GIST_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gist-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
