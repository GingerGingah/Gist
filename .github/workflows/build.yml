name: Build Gist APK

on:
  workflow_dispatch: # lets you press "Run workflow" by hand
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's build machines already include the Android SDK, so there is nothing to install.
      # This only accepts the licences so Gradle can fetch any missing piece itself.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Works whether the repo holds Gist.zip or the unzipped project.
      - name: Find the project
        run: |
          if [ -f Gist.zip ]; then unzip -q -o Gist.zip; fi
          if [ -d Gist ]; then echo "PROJECT=Gist" >> "$GITHUB_ENV"; else echo "PROJECT=." >> "$GITHUB_ENV"; fi

      # Same job as setup-sherpa.ps1, for Linux: the speech library's native files and Kotlin wrapper.
      - name: Add the speech library
        working-directory: ${{ env.PROJECT }}
        run: |
          VERSION=1.13.8
          curl -fL -o android.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VERSION}/sherpa-onnx-v${VERSION}-android.tar.bz2"
          mkdir -p libs && tar -xjf android.tar.bz2 -C libs
          ARM=$(find libs -type d -name arm64-v8a | head -n 1)
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$ARM"/*.so app/src/main/jniLibs/arm64-v8a/
          curl -fL -o source.zip "https://github.com/k2-fsa/sherpa-onnx/archive/refs/tags/v${VERSION}.zip"
          unzip -q source.zip -d sherpa-src
          KT=$(find sherpa-src -type d -name kotlin-api | head -n 1)
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp "$KT"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/

      - name: Build the APK
        working-directory: ${{ env.PROJECT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gist-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
